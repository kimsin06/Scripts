<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ParçaBul{% endblock %} · En ucuz oto yedek parça</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#677084; --line:#e2e5ea; --accent:#e85d04; --ok:#1f8a4c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; }
  header .wrap { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header a { color:#fff; text-decoration:none; }
  .logo { font-weight:800; font-size:20px; }
  .logo span { color:var(--accent); }
  nav { margin-left:auto; display:flex; gap:14px; align-items:center; font-size:14px; }
  nav form { margin:0; }
  nav button { background:none; border:0; color:#fff; cursor:pointer; font:inherit; padding:0; }
  .wrap { max-width:960px; margin:0 auto; padding:14px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin:14px 0; }
  .search { display:flex; gap:8px; }
  .search input { flex:1; min-width:0; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:15px; cursor:pointer; text-decoration:none; display:inline-block; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  .price { font-weight:700; white-space:nowrap; }
  .best { background:#fff4ec; }
  .tag { font-size:12px; padding:2px 6px; border-radius:4px; background:var(--line); color:var(--muted); white-space:nowrap; }
  .tag.ok { background:#e3f4ea; color:var(--ok); }
  .muted { color:var(--muted); }
  .flash { background:#fff4ec; border:1px solid #f6c7a6; padding:10px; border-radius:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .grid a { display:block; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; }
  .table-scroll { overflow-x:auto; }
  label { display:block; margin:10px 0 4px; font-size:14px; }
  input[type=email], input[type=password] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:15px; }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="{{ url_for('index') }}">Parça<span>Bul</span></a>
  <nav>
    <a href="{{ url_for('vehicles') }}">Araçlar</a>
    {% if user %}
      <a href="{{ url_for('plan') }}">{% if sub_until %}Abone{% else %}Abone ol{% endif %}</a>
      <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button>Çıkış</button></form>
    {% else %}
      <a href="{{ url_for('login') }}">Giriş</a>
      <a href="{{ url_for('register') }}">Kayıt ol</a>
    {% endif %}
  </nav>
</div></header>
<main class="wrap">
  {% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
